name: FridayCode CI
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g fridaycode
      - name: Review PR for bugs and security issues
        run: friday ci --instruction "Review this PR for bugs and security issues" --output markdown
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  fix-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g fridaycode
      - name: Fix TypeScript errors
        run: friday ci -i "Fix all TypeScript errors" --provider openai --model gpt-4o --timeout 300 --max-cost 1.00 --output json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  write-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g fridaycode
      - name: Write tests for changed files
        run: friday ci -i "Write tests for all changed files in this PR" --timeout 600 --max-cost 2.00 --verbose --output text
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
